name: test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        perl:
          - "5.16"
          - "5.42"
    name: Perl ${{ matrix.perl }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: test
        run: |
          cpm install
          perl Build.PL
          ./Build
          ./Build test
